name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: keel, POSTGRES_PASSWORD: keel, POSTGRES_DB: keel }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keel" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://keel:keel@localhost:5432/keel
      KEEL_SECRET: ci-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:studio
      - run: npm run test:e2e:autopilot
        env: { MEDIA_DIR: /tmp/keel-media }
